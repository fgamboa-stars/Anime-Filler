<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('aff:preferences') || '{}');
          var pref = (saved.state && saved.state.theme) || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Anime Filler Finder shows which episodes are canon and which are filler, builds skip-the-filler watch orders, and tracks your progress. Free, no account needed."
    />
    <meta property="og:title" content="Anime Filler Finder" />
    <meta
      property="og:description"
      content="Which episodes should I watch? Which can I skip? Canon and filler guides with shareable watch orders."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://graphql.anilist.co" crossorigin />
    <link rel="preconnect" href="https://s4.anilist.co" />
    <title>Anime Filler Finder</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Anime Filler Finder needs JavaScript to load episode guides.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
